<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">O que orienta a escolha</title>
  <desc id="desc">Brilhos verdes com expansão e luminosidade suaves.</desc>
  <style>.star{transform-origin:150px 170px;animation:shine 4.8s ease-in-out infinite}.small{transform-origin:222px 108px;animation:shine 4.8s ease-in-out -2.4s infinite}@keyframes shine{0%,100%{transform:scale(.96);opacity:.86}50%{transform:scale(1.04);opacity:1}}
    @media(prefers-reduced-motion:reduce){.motion{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="disk" cx=".35" cy=".25" r=".85"><stop stop-color="#FFFFFF"/><stop offset=".56" stop-color="#F7F8F4"/><stop offset=".82" stop-color="#EDF1E8"/><stop offset="1" stop-color="#D3DFCD"/></radialGradient>
    <radialGradient id="rim"><stop offset=".88" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".965" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".99" stop-color="#B6C7AA" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".7"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BBCDB4"/><stop offset=".26" stop-color="#FFFFFF"/><stop offset=".67" stop-color="#A9BD9A"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="green" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#244E39"/><stop offset=".18" stop-color="#81A777"/><stop offset=".36" stop-color="#D4E5B8"/><stop offset=".5" stop-color="#668C4B"/><stop offset=".76" stop-color="#A8C94D"/><stop offset="1" stop-color="#315E4B"/></linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315E4B"/><stop offset=".4" stop-color="#486B37"/><stop offset=".67" stop-color="#C7D8C9"/><stop offset="1" stop-color="#244B35"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E3ECDC" stop-opacity=".8"/><stop offset=".45" stop-color="#C7D8C9" stop-opacity=".25"/><stop offset="1" stop-color="#66866C" stop-opacity=".75"/></linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#C6DE7A"/><stop offset=".5" stop-color="#A8C94D"/><stop offset="1" stop-color="#4E783B"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#315E4B" flood-opacity=".17"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="circle"><circle cx="160" cy="160" r="131"/></clipPath>
    
  </defs>
  <circle cx="160" cy="160" r="132" fill="url(#disk)" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#circle)">
    <g fill="#66866C" opacity=".055" filter="url(#soft)">
      <path d="M35 235C69 191 92 153 110 106C105 165 84 213 35 235ZM49 218C36 185 34 157 43 127C47 171 63 191 49 218ZM66 192C53 159 53 127 68 94C62 140 78 167 66 192ZM81 165C112 146 138 143 157 149C121 155 111 177 81 165ZM63 198C95 173 124 176 145 182C106 187 93 209 63 198ZM46 229C78 207 104 210 125 218C92 220 72 243 46 229Z"/>
    </g>
    <path d="M57 91C74 64 96 50 118 46C93 67 76 92 69 115Z" fill="white" opacity=".65"/>
