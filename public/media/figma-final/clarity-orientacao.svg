    <path d="M227 262C254 245 274 213 279 182" stroke="#A8C94D" stroke-width="6" opacity=".12" filter="url(#soft)"/>
  </g>
  <circle cx="160" cy="160" r="130" fill="url(#rim)"/>
  <circle cx="160" cy="160" r="126" stroke="#FFFFFF" stroke-opacity=".75"/>

  <g filter="url(#shadow)" stroke="url(#bevel)" stroke-width="3" stroke-linejoin="round">
    <g class="motion star">
      <path d="M150 91C158 91 157 126 174 144C192 161 224 161 224 170C224 179 193 180 175 196C157 214 158 249 150 249C142 249 142 215 124 197C107 180 76 179 76 170C76 161 108 161 125 144C142 126 141 91 150 91Z" fill="url(#green)"/>
      <path d="M150 106C148 139 133 158 95 170" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".72"/>
      <path d="M169 193C157 211 155 226 151 238" stroke="#ECF3C7" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
    <g class="motion small">
      <path d="M222 73C227 73 226 89 234 97C243 106 259 104 259 109C259 115 242 114 234 122C226 130 227 146 222 146C217 146 217 130 209 122C201 114 185 114 185 109C185 104 201 105 209 97C217 89 217 73 222 73Z" fill="url(#green)"/>
      <path d="M221 83C219 99 213 103 198 109" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".75"/>
